[workspace]
resolver = "2"
members = [
    "common",
    "hello-world",
    "issuer-registry",
    "credential-status",
    "consent-registry",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
