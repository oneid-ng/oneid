name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install → Lint → Typecheck → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts (esbuild, sharp)
        run: pnpm exec turbo run build --dry 2>/dev/null || true
        # esbuild postinstall runs as part of install; this step is a no-op placeholder
        # to document that only esbuild and sharp are allowed (see package.json pnpm.onlyBuiltDependencies)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Turborepo remote cache — disabled for now (no token configured)
          TURBO_TOKEN: ""
          TURBO_TEAM: ""
